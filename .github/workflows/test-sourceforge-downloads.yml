  name: 'Test SourceForge downloads'

  on:
    schedule:
      - cron: '42 1 * * 6' # every Sunday
    workflow_dispatch:

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v2
          with:
            repository: xpack-dev-tools/xbb-helper-xpack
            ref: 'xpack-development'

        - name: Show environment
          run: |
            ls -lLA
            env | sort | grep -E '^[^ \t]+='

        - name: Run test
          run: |
            #!/usr/bin/env bash
            set -e

            # The script is in the xbb-helper-xpack repo.
            source maintenance-scripts/download-sourceforge-source.sh

            function download_sourceforge_2025_no_darwin()
            {
              local name="$1"
              local version="$2"
              local threshold=$3

              download_sourceforge_one "${name}" "${version}" "win32-x64" ${threshold}
              download_sourceforge_one "${name}" "${version}" "linux-x64" ${threshold}
              download_sourceforge_one "${name}" "${version}" "linux-arm64" ${threshold}
            }

            date

            # https://sourceforge.net/projects/gcc-xpack/files/
            threshold=10000
            download_sourceforge_2025_no_darwin "gcc" "11.5.0-2"  ${threshold}
            download_sourceforge_2025_no_darwin "gcc" "12.4.0-2"  ${threshold}
            download_sourceforge_2025_no_darwin "gcc" "13.3.0-2"  ${threshold}
            download_sourceforge_2025_no_darwin "gcc" "14.2.0-2"  ${threshold}
            download_sourceforge_2023 "gcc" "14.1.0-1"  ${threshold}
            download_sourceforge_2023 "gcc" "13.2.0-2"  ${threshold}
            download_sourceforge_2023 "gcc" "12.3.0-2"  ${threshold}
            download_sourceforge_2023 "gcc" "11.4.0-2"  ${threshold}
            download_sourceforge_2023 "gcc" "12.2.0-2"  ${threshold}
            download_sourceforge_2023 "gcc" "11.3.0-1"  ${threshold}
            download_sourceforge_2023 "gcc" "11.2.0-3"  ${threshold}
